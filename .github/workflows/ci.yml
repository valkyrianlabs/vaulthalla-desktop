name: CI
# VaulthallaKit tests and an unsigned app build on Apple Silicon. Nothing here signs or publishes.
# Pull requests only: main takes changes only through pull requests that passed this, so a push run would build the
# same tree again on a hosted Mac. A pull request that changes only docs skips the Mac job (a skipped required check
# passes). Run it by hand from Actions when needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Decide whether the Mac job runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Anything but Markdown, docs/ and LICENSE needs the Mac.
          if git diff --name-only "$BASE...HEAD" | grep -qvE '(^docs/|\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS 27 hosted image (public preview, same label as the server's macOS job).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The app embeds the Go 1Password helper (Helpers/vaulthalla-1password), and the package tests build its fake mode.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Helpers/vaulthalla-1password/go.mod
          cache-dependency-path: Helpers/vaulthalla-1password/go.sum
      - name: 1Password helper tests
        working-directory: Helpers/vaulthalla-1password
        run: go vet ./... && go vet -tags fake ./... && go test ./...
      - name: Contract is generated, not edited
        run: python3 tools/gen-contract.py --check && python3 tools/test_gen_contract.py
      - name: Package tests
        run: swift test
      - name: App build (unsigned)
        run: |
          xcodebuild -project App/Vaulthalla.xcodeproj -scheme Vaulthalla -configuration Debug \
            -derivedDataPath build/DerivedData.noindex CODE_SIGNING_ALLOWED=NO -quiet build
