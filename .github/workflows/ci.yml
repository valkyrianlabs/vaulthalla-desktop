name: CI
# VaulthallaKit tests and an unsigned app build on Apple Silicon. Nothing here signs or publishes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # macOS 27 hosted image (public preview, same label as the server's macOS job).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The app embeds the Go 1Password helper (Helpers/vaulthalla-1password), and the package tests build its fake mode.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Helpers/vaulthalla-1password/go.mod
          cache-dependency-path: Helpers/vaulthalla-1password/go.sum
      - name: 1Password helper tests
        working-directory: Helpers/vaulthalla-1password
        run: go vet ./... && go vet -tags fake ./... && go test ./...
      - name: Contract is generated, not edited
        run: python3 tools/gen-contract.py --check && python3 tools/test_gen_contract.py
      - name: Package tests
        run: swift test
      - name: App build (unsigned)
        run: |
          xcodebuild -project App/Vaulthalla.xcodeproj -scheme Vaulthalla -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet build
