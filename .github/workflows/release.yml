name: Release
# The Developer ID release (tools/release/build.sh): a signed app and DMG, both notarized and stapled, and the Sparkle
# appcast that offers it. A tag vX.Y.Z that matches VERSION publishes them as the latest GitHub release, which is where
# the app's feed points (SUFeedURL: releases/latest/download/appcast.xml); a pull request that touches the release
# tooling rehearses the whole pipeline, notarization included, and publishes nothing.
#
# Organization secrets (valkyrianlabs, this repository selected):
#   MACOS_SIGNING_P12, MACOS_SIGNING_P12_PASSWORD     the Developer ID Application identity (+ G2 intermediate)
#   MACOS_PROFILE_APP, MACOS_PROFILE_FILEPROVIDER,    the Developer ID profiles "Vaulthalla Desktop",
#   MACOS_PROFILE_MCP                                 "Vaulthalla Desktop Finder" and "Vaulthalla Desktop MCP", base64
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD   notarytool credentials
#   SPARKLE_ED_PRIVATE_KEY                            the EdDSA key that signs updates (public half: SUPublicEDKey)
#   HOMEBREW_TAP_TOKEN                                contents:write on valkyrianlabs/homebrew-tap (the cask)
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - tools/release/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dmg:
    name: Signed and notarized DMG
    # Secrets never reach pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: Helpers/vaulthalla-1password/go.mod
          cache-dependency-path: Helpers/vaulthalla-1password/go.sum

      - name: The tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION ($version)"
            exit 1
          fi

      - name: Signing keychain, profiles and notary credentials
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.MACOS_PROFILE_APP }}
          PROFILE_FILEPROVIDER: ${{ secrets.MACOS_PROFILE_FILEPROVIDER }}
          PROFILE_MCP: ${{ secrets.MACOS_PROFILE_MCP }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046  # the existing search list, one keychain per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "VH_SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

          # Xcode finds profiles by name in either directory, depending on its version.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
          done
          for profile in "$PROFILE_APP" "$PROFILE_FILEPROVIDER" "$PROFILE_MCP"; do
            echo "$profile" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
            uuid=$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" | plutil -extract UUID raw -o - -)
            cp "$RUNNER_TEMP/profile.provisionprofile" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.provisionprofile"
            mv "$RUNNER_TEMP/profile.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.provisionprofile"
          done

          xcrun notarytool store-credentials vaulthalla-notary --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$kc"
          echo "VH_NOTARY_PROFILE=vaulthalla-notary" >> "$GITHUB_ENV"

          (umask 077 && printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key")
          echo "VH_SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: tools/release/build.sh --out "$RUNNER_TEMP/release"

      # Homebrew checks casks only inside a tap: a throwaway one on this runner.
      - name: Homebrew cask style and audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew tap-new --no-git vh-ci/local >/dev/null
          tap=$(brew --repository vh-ci/local)
          mkdir -p "$tap/Casks"
          cp "$RUNNER_TEMP/release/vaulthalla-desktop.rb" "$tap/Casks/"
          if brew commands --quiet | grep -qx trust; then brew trust --tap vh-ci/local; fi
          brew style --cask vh-ci/local/vaulthalla-desktop
          brew audit --cask --strict vh-ci/local/vaulthalla-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: vaulthalla-desktop-dmg
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.dmg.sha256
            ${{ runner.temp }}/release/appcast.xml
            ${{ runner.temp }}/release/vaulthalla-desktop.rb
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain and the Sparkle key
        if: always()
        run: |
          if [ -n "${VH_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$VH_SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/sparkle.key"

  publish:
    name: GitHub release
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vaulthalla-desktop-dmg
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          (cd release && sha256sum -c "Vaulthalla-$version.dmg.sha256")
          # Never a prerelease: releases/latest, the app's update feed, skips prereleases.
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.sha256 release/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "Vaulthalla Desktop $version" --generate-notes

      # After the release, so the cask never points at a DMG that isn't published yet.
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::no HOMEBREW_TAP_TOKEN: cask not updated"; exit 0; fi
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/valkyrianlabs/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp release/vaulthalla-desktop.rb tap/Casks/vaulthalla-desktop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vaulthalla-desktop.rb
          if git diff --cached --quiet; then echo "cask already at $version"; exit 0; fi
          git commit -q -m "vaulthalla-desktop $version"
          git push -q origin HEAD:main
